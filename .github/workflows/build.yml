name: Build SKSE Plugin

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build AutoShotClickCasting.dll
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure vcpkg Cache Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:LOCALAPPDATA\vcpkg\archives" -Force

      - name: Restore/Save vcpkg Binary Cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build Plugin
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Package Mod Files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "package/SKSE/Plugins" -Force
          $dll = Get-ChildItem -Path "build" -Filter "AutoShotClickCasting.dll" -Recurse | Select-Object -First 1
          if (-not $dll) {
              throw "AutoShotClickCasting.dll not found in build directory!"
          }
          Write-Host "Found compiled DLL at: $($dll.FullName)"
          Copy-Item $dll.FullName -Destination "package/SKSE/Plugins/"
          
          New-Item -ItemType Directory -Path "package/MCM/Config/AutoShotClickCasting" -Force
          Copy-Item "mcm/config/config.json" -Destination "package/MCM/Config/AutoShotClickCasting/"
          Copy-Item "mcm/config/settings.ini" -Destination "package/MCM/Config/AutoShotClickCasting/"
          
          New-Item -ItemType Directory -Path "package/Source/Scripts" -Force
          Copy-Item "mcm/papyrus/AutoShotClickCasting_MCM.psc" -Destination "package/Source/Scripts/"
          
          Compress-Archive -Path "package/*" -DestinationPath "AutoShotClickCasting-v2.1.0.zip"

      - name: Upload Binary & Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoShotClickCasting-v2.1.0-Artifacts
          path: |
            package/SKSE/Plugins/AutoShotClickCasting.dll
            AutoShotClickCasting-v2.1.0.zip
          retention-days: 30
